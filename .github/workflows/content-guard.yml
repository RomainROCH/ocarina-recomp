name: Content guard

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_content.py
      - run: python tests/check_content_test.py
      - name: Check unsupported mesh prewarm policy (GCC and Clang)
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic tests/test_vk_prewarm_mesh.c -o /tmp/vk-prewarm-gcc
          /tmp/vk-prewarm-gcc
          clang -std=c11 -Wall -Wextra -Werror -pedantic tests/test_vk_prewarm_mesh.c -o /tmp/vk-prewarm-clang
          /tmp/vk-prewarm-clang
